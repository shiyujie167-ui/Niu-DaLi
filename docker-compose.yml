# New-API Docker Compose Configuration
#
# Quick Start:
#   1. Copy .env.example to .env and replace the local-only secrets.
#   2. docker compose up -d --build
#   3. Access at http://localhost:3000
#
# Using MySQL instead of PostgreSQL:
#   1. Comment out the postgres service and PostgreSQL SQL_DSN.
#   2. Uncomment the mysql service and MySQL SQL_DSN.
#   3. Replace postgres with mysql in depends_on.
#   4. Uncomment mysql_data in the volumes section.
#
# ⚠️  IMPORTANT: Change all default passwords before deploying to production!

services:
  new-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    image: calciumion/new-api:latest
    container_name: new-api
    restart: always
    command: --log-dir /app/logs
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      SQL_DSN: postgresql://${POSTGRES_USER:-root}:${POSTGRES_PASSWORD:-niu-dali-local-only}@postgres:5432/new-api
#      SQL_DSN: ${MYSQL_USER:-root}:${MYSQL_PASSWORD:-niu-dali-local-only}@tcp(mysql:3306)/new-api  # Point to the mysql service, uncomment if using MySQL
#      LOG_SQL_DSN: postgresql://${POSTGRES_USER:-root}:${POSTGRES_PASSWORD:-niu-dali-local-only}@postgres:5432/new-api-log # OPTIONAL: If you want a separate database for logging, uncomment and set this
#      LOG_SQL_DSN: clickhouse://default:${CLICKHOUSE_PASSWORD:-niu-dali-local-only}@clickhouse:9000/new_api_logs # OPTIONAL: Use ClickHouse for logs only; also uncomment clickhouse in depends_on and the clickhouse service below
#      LOG_SQL_CLICKHOUSE_TTL_DAYS: 0 # OPTIONAL: ClickHouse log retention days. Unset or 0 disables automatic deletion; set to e.g. 30 to keep 30 days
      REDIS_CONN_STRING: redis://:${REDIS_PASSWORD:-niu-dali-local-only}@redis:6379/0
      SESSION_SECRET: ${SESSION_SECRET:-niu-dali-local-session-secret-change-before-production}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SYSTEM_NAME: ${SYSTEM_NAME:-大力牛}
      SYSTEM_LOGO: ${SYSTEM_LOGO:-/niu-dali-icon.png}
      SYSTEM_FOOTER: ${SYSTEM_FOOTER:-大力牛 · Niu Dali Token Service · Powered by New API}
      TZ: ${TZ:-Asia/Shanghai}
      ERROR_LOG_ENABLED: ${ERROR_LOG_ENABLED:-true}
      BATCH_UPDATE_ENABLED: ${BATCH_UPDATE_ENABLED:-true}
      NODE_NAME: new-api-node-1
#      STREAMING_TIMEOUT: 300  # 流模式无响应超时时间，单位秒，默认120秒，如果出现空补全可以尝试改为更大值 （Streaming timeout in seconds, default is 120s. Increase if experiencing empty completions）
#      RELAY_IDLE_CONN_TIMEOUT: 90  # Relay HTTP 客户端空闲连接超时时间，单位秒，默认跟随 Go 标准库，设置为0表示不限制 (Relay HTTP client idle keep-alive timeout in seconds, defaults to Go standard library; set 0 to disable)
#      SESSION_COOKIE_SECURE: true  # true：启用 Secure Refresh Cookie 和严格 refresh/logout OriginGuard；false/未配置：关闭 OriginGuard，仅用于本地 HTTP (true: Secure cookie + strict refresh/logout OriginGuard; false/unset: guard disabled for local HTTP only)
#      SESSION_COOKIE_TRUSTED_URL: https://example.com,https://admin.example.com  # Secure=true 时必填的精确 HTTPS Origin；不是 relay CORS 白名单，不支持通配符/路径 (Required exact HTTPS origins when Secure=true; not a relay CORS allowlist, no wildcard/path)
#      TRUSTED_PROXIES: 172.20.0.0/16  # 未配置时信任回环/RFC1918/fc00::/7 并告警，none 为严格模式，显式列表替代默认值 (Unset trusts loopback/RFC 1918/fc00::/7 with a warning; none trusts no proxies; an explicit list replaces defaults)
#      USER_SESSION_ACTIVE_LIMIT: 50
#      USER_SESSION_ISSUANCE_LIMIT: 100
#      USER_SESSION_ISSUANCE_WINDOW_SECONDS: 86400  # 不得大于 revoked 保留期 (must not exceed revoked retention)
#      USER_SESSION_REVOKED_RETENTION_DAYS: 7
#      USER_SESSION_HOURLY_ALERT_THRESHOLD: 5000  # 仅告警，不做全局拒绝 (alert only; never globally rejects login)
#      SYNC_FREQUENCY: 60  # Uncomment if regular database syncing is needed
#      GOOGLE_ANALYTICS_ID: G-XXXXXXXXXX  # Google Analytics 的测量 ID (Google Analytics Measurement ID)
#      UMAMI_WEBSITE_ID: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx  # Umami 网站 ID (Umami Website ID)
#      UMAMI_SCRIPT_URL: https://analytics.umami.is/script.js  # Umami 脚本 URL，默认为官方地址 (Umami Script URL, defaults to official URL)

    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
#      - mysql  # Uncomment if using MySQL
#      - clickhouse  # Uncomment if using ClickHouse for LOG_SQL_DSN
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -Eq '\"success\"[[:space:]]*:[[:space:]]*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7.4.2-alpine
    container_name: redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-niu-dali-local-only}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-niu-dali-local-only}
    volumes:
      - redis_data:/data
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:15.10-alpine
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-niu-dali-local-only}
      POSTGRES_DB: new-api
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d new-api"]
      interval: 5s
      timeout: 3s
      retries: 10
#    ports:
#      - "5432:5432"  # Uncomment if you need to access PostgreSQL from outside Docker

#  mysql:
#    image: mysql:8.2
#    container_name: mysql
#    restart: always
#    environment:
#      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-niu-dali-local-only}
#      MYSQL_DATABASE: new-api
#    volumes:
#      - mysql_data:/var/lib/mysql
#    networks:
#      - new-api-network
#    ports:
#      - "3306:3306"  # Uncomment if you need to access MySQL from outside Docker

#  clickhouse:
#    image: clickhouse/clickhouse-server:24.8
#    container_name: clickhouse
#    restart: always
#    environment:
#      CLICKHOUSE_DB: new_api_logs
#      CLICKHOUSE_USER: default
#      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-niu-dali-local-only}
#      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
#    volumes:
#      - clickhouse_data:/var/lib/clickhouse
#    networks:
#      - new-api-network
#    ports:
#      - "8123:8123"  # HTTP interface, uncomment if you need external access
#      - "9000:9000"  # Native interface used by the LOG_SQL_DSN example above

volumes:
  pg_data:
  redis_data:
#  mysql_data:
#  clickhouse_data:

networks:
  new-api-network:
    driver: bridge
